name: Deploy to Release

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            build/fg_cache
          key: ${{ runner.os }}-fg-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-fg-

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Clean up secondary jars
        run: |
          rm -f build/libs/*-sources.jar
          rm -f build/libs/*-javadoc.jar

      - name: Generate Attestation
        uses: actions/attest@v4
        with:
          subject-path: build/libs/*.jar

      - name: Extract Release Notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          BODY=""
          
          if [ -f "changelog.md" ]; then
            BODY=$(awk "/^# $TAG/{flag=1; next} /^# /{flag=0} flag" changelog.md)
          fi
          
          cat << EOF > notes.txt
          ![Verified](https://img.shields.io/badge/Artifact_Attestations-Verified-success?style=flat&logo=github)
          
          ${BODY:-Release $TAG}
          EOF

      - name: Create Release
        run: |
          EXTRA_FLAGS=""
          if [[ "${{ github.ref_name }}" == *"alpha"* ]]; then
            EXTRA_FLAGS="--prerelease"
          fi
          
          gh release create "${{ github.ref_name }}" build/libs/*.jar \
            --title "${{ github.ref_name }}" \
            --notes-file notes.txt \
            $EXTRA_FLAGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}