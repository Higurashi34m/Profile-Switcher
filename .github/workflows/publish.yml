name: Deploy to maven

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            build/fg_cache
          key: ${{ runner.os }}-fg-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-fg-

      - name: Build and Publish to Local
        run: |
          chmod +x gradlew
          ./gradlew publish --no-daemon

      - name: Push to maven
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/maven-repo
          repository-name: Higurashi34m/maven
          branch: main
          target-folder: .
          token: ${{ secrets.MAVEN_TOKEN }}
          clean: false